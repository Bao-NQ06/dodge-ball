# Reward coefficients per curriculum phase.
# terminal: always on.
# dense: annealed to ~0 by phase 4.

terminal:
  hit_opponent: 10.0
  got_hit: -10.0
  timeout_draw: -1.0

phases:
  1:  # Motor skills - heavy shaping
    approach_ball: 0.05
    pickup_ball: 5.0
    throw_alignment: 3.0
    near_miss_bonus: 1.0
    dodge_progress: 0.0
    time_penalty: 0.0005
    shaping_scale: 1.0

  2:  # Landing hits - reduce shaping
    approach_ball: 0.010
    pickup_ball: 0.5
    throw_alignment: 0.8
    near_miss_bonus: 0.4
    dodge_progress: 0.05
    time_penalty: 0.001
    shaping_scale: 0.6

  3:  # Dodging - heavy dodge reward
    approach_ball: 0.005
    pickup_ball: 0.2
    throw_alignment: 0.4
    near_miss_bonus: 0.3
    dodge_progress: 0.20
    time_penalty: 0.001
    shaping_scale: 0.3

  4:  # Full self-play - mostly sparse
    approach_ball: 0.0
    pickup_ball: 0.0
    throw_alignment: 0.1
    near_miss_bonus: 0.0
    dodge_progress: 0.05
    time_penalty: 0.0005
    shaping_scale: 0.1